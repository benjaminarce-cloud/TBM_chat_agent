services:
  postgres:
    build:
      context: backend
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: tbm_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tbm_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - tbm_chat_pgdata:/var/lib/postgresql/data

volumes:
  tbm_chat_pgdata:
