name: Live widget smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      widget_url:
        description: Widget deployment URL to test
        required: true
        default: https://frontend-nine-delta-71.vercel.app

permissions:
  contents: read

concurrency:
  group: live-widget-smoke-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.environment_url, 'vercel.app'))
    runs-on: ubuntu-latest
    env:
      # Vercel preview URLs require SSO. Deployment events trigger this check, but the
      # browser targets the public pilot alias unless a manual run supplies another URL.
      E2E_LIVE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.widget_url || 'https://frontend-nine-delta-71.vercel.app' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Test deployed widget
        run: npm run test:e2e:live
        working-directory: frontend
