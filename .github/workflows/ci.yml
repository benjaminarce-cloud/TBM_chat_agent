name: Pilot CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: tbm_chat_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tbm_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tbm_chat_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tbm_chat_test
      ENVIRONMENT: test
      WIDGET_TOKEN_SECRET: ci-widget-token-secret-at-least-32-chars
      IP_HASH_SALT: ci-ip-hash-salt-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff format --check app tests && ruff check app tests
        working-directory: backend
      - run: pytest -q -m 'not live_llm'
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
