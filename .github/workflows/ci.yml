name: Pilot CI

on:
  pull_request:
  push:
    branches: [main, codex/pilot-build]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tbm_chat_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tbm_chat_test
      ENVIRONMENT: test
      WIDGET_TOKEN_SECRET: ci-widget-token-secret-at-least-32-chars
      IP_HASH_SALT: ci-ip-hash-salt-at-least-32-characters
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start pinned PostgreSQL test container
        run: |
          docker build -f backend/Dockerfile.postgres -t tbm-postgres-test backend
          docker run --detach --name tbm-postgres \
            --env POSTGRES_DB=tbm_chat_test \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --publish 127.0.0.1:5432:5432 \
            tbm-postgres-test
          for attempt in {1..20}; do
            docker exec tbm-postgres pg_isready -U postgres -d tbm_chat_test && exit 0
            sleep 2
          done
          docker logs tbm-postgres
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r requirements-dev.lock
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: ruff format --check app tests && ruff check app tests
        working-directory: backend
      - run: pytest -q -m 'not live_llm'
        working-directory: backend
      - run: docker build --tag tbm-chat:test .
        working-directory: backend
      - run: docker run --rm tbm-chat:test python -m app.jobs.browser_smoke
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CHAT_API_URL: https://api.example.invalid
      PRIVACY_NOTICE_VERSION: ci-approved-v1
      PRIVACY_NOTICE_ES: Aviso de privacidad para la compilación de CI.
      PRIVACY_NOTICE_EN: Privacy notice for the CI build.
      WIDGET_FRAME_ANCESTORS: "'self' https://example.invalid"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run deterministic widget browser tests
        run: npm run test:e2e
        working-directory: frontend
